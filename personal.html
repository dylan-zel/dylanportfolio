<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Astrophotography and hiking photos by Dylan Zelko.">
  <title>Dylan Zelko | Personal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260817-personal-wide-title">
</head>
<body class="personal-page">
  <header class="site-header">
    <a class="brand" href="index.html">Dylan Zelko</a>
    <nav aria-label="Primary navigation">
      <a href="index.html">Professional</a>
      <a class="active" href="personal.html">Personal</a>
    </nav>
  </header>

  <main>
    <section class="personal-intro reveal">
      <div>
        <p class="eyebrow">Personal</p>
        <h1>Astrophotography and trails.</h1>
        <p class="lede">A small collection of sky photos, waterfall hikes, and outdoor shots that sit outside the resume but still feel like part of how I look at things.</p>
      </div>
    </section>

    <section class="section photo-section reveal" id="astrophotography">
      <div class="section-heading">
        <p class="eyebrow">Astrophotography</p>
      </div>
      <div class="gallery-grid">
        <button class="gallery-item tall" data-title="Deep Sky Field" data-image="assets/personal-astro-01.jpg">
          <img src="assets/personal-astro-01.jpg" alt="Astrophotography star field with faint nebula detail">
        </button>
        <button class="gallery-item" data-title="Galaxy Field" data-image="assets/personal-astro-02.jpg">
          <img src="assets/personal-astro-02.jpg" alt="Astrophotography star field with a bright galaxy">
        </button>
        <button class="gallery-item" data-title="Solar Eclipse" data-image="assets/personal-solar-eclipse.jpg">
          <img src="assets/personal-solar-eclipse.jpg" alt="Solar eclipse photo with the sun partially covered">
        </button>
        <button class="gallery-item tall" data-title="Nebula Detail" data-image="assets/personal-astro-03.jpg">
          <img src="assets/personal-astro-03.jpg" alt="Astrophotography image with stars and reddish nebula structure">
        </button>
        <button class="gallery-item" data-title="Solar Disc" data-image="assets/personal-solar-disc.jpg">
          <img src="assets/personal-solar-disc.jpg" alt="Orange solar disc against a black sky">
        </button>
        <button class="gallery-item wide" data-title="Lunar Detail" data-image="assets/personal-moon-detail.png">
          <img src="assets/personal-moon-detail.png" alt="Detailed half moon against a black sky">
        </button>
      </div>
    </section>

    <section class="section photo-section reveal" id="hiking">
      <div class="section-heading">
        <p class="eyebrow">Hiking</p>
      </div>
      <div class="gallery-grid hiking-gallery">
        <button class="gallery-item" data-title="Layered Gorge" data-image="assets/personal-hiking-01.jpg">
          <img src="assets/personal-hiking-01.jpg" alt="Layered rock wall and rushing water in a gorge">
        </button>
        <button class="gallery-item wide" data-title="Watkins Glen Trail" data-image="assets/personal-hiking-02.jpg">
          <img src="assets/personal-hiking-02.jpg" alt="Green gorge trail with stone walls and water below">
        </button>
        <button class="gallery-item" data-title="Waterfall Trail" data-image="assets/personal-hiking-03.jpg">
          <img src="assets/personal-hiking-03.jpg" alt="Tall waterfall flowing through a green rock gorge">
        </button>
        <button class="gallery-item wide" data-title="Cascading Falls" data-image="assets/personal-hiking-04.jpg">
          <img src="assets/personal-hiking-04.jpg" alt="Cascading waterfall over layered rock">
        </button>
        <button class="gallery-item" data-title="Wetlands Wildlife" data-image="assets/personal-wildlife-01.jpg">
          <img src="assets/personal-wildlife-01.jpg" alt="Reflective wetlands scene with blue sky and water">
        </button>
        <button class="gallery-item" data-title="Waterfall Overlook" data-image="assets/personal-waterfall-02.jfif">
          <img src="assets/personal-waterfall-02.jfif" alt="Waterfall rushing through a wooded ravine">
        </button>
      </div>
    </section>
  </main>

  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Gallery preview">
    <button class="lightbox-close" type="button" aria-label="Close preview">&times;</button>
    <div class="lightbox-art"></div>
    <h2></h2>
  </div>

  <footer>
    <span>&copy; <span id="year"></span> Dylan Zelko</span>
  </footer>

  <script src="script.js?v=20260817-personal-redesign"></script>
</body>
</html>
